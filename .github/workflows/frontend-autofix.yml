name: One-time Frontend Autofix
on:
  push:
    branches: [feature/carpool-ui-foundation]
permissions:
  contents: write
jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[frontend-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carpool-ui-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install
      - run: npx eslint . --fix
      - run: npx prettier --write .
      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No autofixes to commit"
          else
            git commit -m "Apply frontend lint and formatting autofixes [frontend-autofix]"
            git push origin HEAD:feature/carpool-ui-foundation
          fi
