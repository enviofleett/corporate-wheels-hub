name: Carpool UI Release Gate
on:
  push:
    branches: [feature/carpool-ui-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carpool-ui-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install
      - run: npx eslint . --fix
      - run: npx prettier --write .
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated cleanup to commit"
          else
            git commit -m "Apply frontend formatting and lockfile cleanup [frontend-autofix]"
            git push origin HEAD:feature/carpool-ui-foundation
          fi
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
